version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxfile-postgres
    environment:
      POSTGRES_DB: fluxfile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxfile

  redis:
    image: redis:7-alpine
    container_name: fluxfile-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxfile

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: fluxfile-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fluxfile
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker-docker-01
      NODE_ENV: development
      # R2 credentials - set these in .env or pass at runtime
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-fluxfile}
    networks:
      - fluxfile
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  fluxfile:
    driver: bridge
